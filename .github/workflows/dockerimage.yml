name: Build and Push docker image
on:
  pull_request:
    branches: master
  push:
    branches:
      - '*'
    tags:
      - v*
permissions:
  contents: read
jobs:
  build:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != 'wahyd4/aria2-ariang-docker'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
    -
      name: Update APP VERSION
      if: contains(github.ref, '/tags/v')
      run: |
        VERSION=${GITHUB_REF#refs/tags/v}
        echo "${VERSION}" > APP_VERSION
    -
      name: Prepare
      id: prepare
      run: |
        DOCKER_IMAGE=wahyd4/aria2-ui
        DOCKER_PLATFORMS=linux/amd64,linux/arm/v7,linux/arm64
        VERSION=edge

        if [[ $GITHUB_REF == refs/tags/* ]]; then
          VERSION=${GITHUB_REF#refs/tags/v}
        fi
        TAGS="--tag ${DOCKER_IMAGE}:${VERSION}"
        if [[ $VERSION =~ ^[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}$ ]]; then
          TAGS="$TAGS --tag ${DOCKER_IMAGE}:latest"
        fi

        {
          echo "docker_image=${DOCKER_IMAGE}"
          echo "version=${VERSION}"
          echo "buildx_args=--platform ${DOCKER_PLATFORMS} --build-arg VERSION=${VERSION} --build-arg BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ') --build-arg VCS_REF=${GITHUB_SHA::8} ${TAGS} --file Dockerfile ."
        } >> "$GITHUB_OUTPUT"
    -
      name: Set up QEMU
      uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
    -
      name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
    -
      name: Cache Docker layers
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      id: cache
      with:
        path: /tmp/.buildx-cache
        key: ${{ runner.os }}-buildx-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-buildx-
    -
      name: Docker Buildx (build)
      run: |
        docker buildx build --output "type=image,push=false" ${{ steps.prepare.outputs.buildx_args }}
    -
      name: Login to DockerHub
      if: contains(github.ref, '/heads/master') || contains(github.ref, '/tags/v')
      uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
      with:
        username: ${{ secrets.DOCKER_HUB_USER }}
        password: ${{ secrets.DOCKER_HUB_PASS }}
    -
      name: Push docker images to Dockerhub
      if: contains(github.ref, '/heads/master') || contains(github.ref, '/tags/v')
      run: |
        docker buildx build --output "type=image,push=true" ${{ steps.prepare.outputs.buildx_args }}
    -
      name: Inspect image
      if: contains(github.ref, '/heads/master') || contains(github.ref, '/tags/v')
      run: |
        docker buildx imagetools inspect ${{ steps.prepare.outputs.docker_image }}:${{ steps.prepare.outputs.version }}
    -
      name: Commit changes
      if: contains(github.ref, '/tags/v')
      run: |
        git config user.name junv-repo-bot
        git config user.email me@toozhao.com
        git fetch origin master
        git checkout -B master origin/master
        VERSION=${GITHUB_REF#refs/tags/v}
        echo "${VERSION}" > APP_VERSION
        git add APP_VERSION
        if ! git diff --cached --quiet; then
          git commit -m 'Update version'
          git push origin master
        fi
    -
      name: Update tag
      if: contains(github.ref, '/tags/v')
      env:
        API_KEY: ${{ secrets.BadgeAPIKey }}
      run: |
        VERSION=${GITHUB_REF#refs/tags/v}
        curl --max-time 6 -XPUT -D- 'https://badges.toozhao.com/val/aria2-ui-docker' \
        -H 'Content-Type: application/json' \
        -H "API_KEY: ${API_KEY}" \
        -d "{\"value\": \"${VERSION}\"}" || true
