name: Docker Image Vulnability Check
on:
  pull_request:
    branches: master
  push:
    branches:
      - '*'
permissions:
  contents: read
jobs:
  build:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != 'wahyd4/aria2-ariang-docker'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Build the Docker image
      run: docker build . --file Dockerfile --tag local/aria-ui:latest
    - name: Scan image
      id: scan
      uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
      with:
        image: "local/aria-ui:latest"
        # Informational only: most findings come from Debian trixie packages
        # with no upstream fix and from pinned upstream binaries (Caddy,
        # rclone, File Browser) built against an older Go toolchain. Gating on
        # them would keep this check permanently red, so it reports instead.
        fail-build: false
        severity-cutoff: high
        output-format: json
    - name: grype scan JSON results
      if: always()
      run: |
        report="${{ steps.scan.outputs.json }}"
        if [ -n "$report" ] && [ -f "$report" ]; then
          echo "---- ${report} ----"
          cat "$report"
        fi
